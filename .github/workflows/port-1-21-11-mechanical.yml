name: Port Minecraft 1.21.11 mechanical API renames
on:
  push:
    branches:
      - 1.21.11-neoforge-port
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1.21.11-neoforge-port
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Apply mechanical Java source renames
        run: python3 -c 'from pathlib import Path; from functools import reduce; rules=[("ResourceLocationException","IdentifierException"),("ResourceLocationSearchTree","IdentifierSearchTree"),("ResourceLocationArgument","IdentifierArgument"),("ResourceLocationPattern","IdentifierPattern"),("ResourceLocationParseRule","IdentifierParseRule"),("readResourceLocation","readIdentifier"),("writeResourceLocation","writeIdentifier"),("getResourceLocation","getIdentifier"),("searchResourceLocation","searchIdentifier"),("isValidResourceLocation","isValidIdentifier"),("resourceLocationSearchTree","identifierSearchTree"),("ResourceLocation","Identifier"),("net.minecraft.advancements.critereon","net.minecraft.advancements.criterion"),("import net.minecraft.Util;","import net.minecraft.util.Util;"),("import net.minecraft.FileUtil;","import net.minecraft.util.FileUtil;"),("import net.minecraft.BlockUtil;","import net.minecraft.util.BlockUtil;")]; changed=[(p,old,reduce(lambda value,rule:value.replace(*rule),rules,old.decode("utf-8"))) for p,old in [(p,open(p,"rb").read()) for p in Path("src/main/java").rglob(chr(42)+".java")]]; [open(p,"wb").write(new.encode("utf-8")) for p,old,new in changed if old.decode("utf-8")!=new]; print("Mechanical rename updated",sum(old.decode("utf-8")!=new for _,old,new in changed),"Java files.")'
      - name: Apply easy 1.21.11 API fixes
        run: python3 -c 'from pathlib import Path; from functools import reduce; rules=[("import net.minecraft.world.entity.monster.WitherSkeleton;","import net.minecraft.world.entity.monster.skeleton.WitherSkeleton;"),("import net.minecraft.world.entity.FlyingMob;",""),("FlyingMob","Mob"),("ArmorItem.Type","net.minecraft.world.item.equipment.ArmorType"),("org.checkerframework.checker.nullness.qual.NonNull","org.jspecify.annotations.NonNull")]; changed=[(p,old,reduce(lambda value,rule:value.replace(*rule),rules,old.decode("utf-8"))) for p,old in [(p,open(p,"rb").read()) for p in Path("src/main/java").rglob(chr(42)+".java")]]; [open(p,"wb").write(new.encode("utf-8")) for p,old,new in changed if old.decode("utf-8")!=new]; print("Easy API fixes updated",sum(old.decode("utf-8")!=new for _,old,new in changed),"Java files.")'
      - name: Commit transformed Java sources
        run: git config user.name 'github-actions[bot]' && git config user.email '41898282+github-actions[bot]@users.noreply.github.com' && git add src/main/java && (git diff --cached --quiet || git commit -m 'Apply Minecraft 1.21.11 mechanical API renames') && git push origin HEAD:1.21.11-neoforge-port
      - name: Compile Java sources
        run: ./gradlew compileJava --no-daemon --stacktrace